<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard — KIH Skateboarding</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="kih-logo.png" type="image/png" />
<link rel="apple-touch-icon" href="kih-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo" aria-label="KIH Skateboarding home">
      <img src="kih-logo.png" alt="KIH Skateboarding logo" width="90" height="90" />
    </a>
    <div class="dash-nav-user">
      <span class="dash-nav-name" id="user-name" hidden></span>
      <button type="button" class="btn dash-signout" id="signout-btn">SIGN OUT</button>
    </div>
  </div>
</header>

<main class="dash-main" id="dash-main" hidden>
  <div class="dash-wrap">
    <h1 class="section-heading dash-heading">
      MY DASHBOARD
      <svg class="scribble-underline small" viewBox="0 0 320 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 14 C 50 5, 90 20, 140 11 S 220 3, 280 13 S 310 17, 316 9" />
      </svg>
    </h1>

    <!-- ---------------- upcoming lessons ---------------- -->
    <section class="dash-section card-cream">
      <h2 class="dash-section-heading">
        UPCOMING LESSONS
        <svg class="hand-line" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 60 2, 140 10, 220 5 S 280 2, 298 7" /></svg>
      </h2>

      <ul class="lesson-list" id="lesson-list">
        <li class="empty-state">Loading…</li>
      </ul>

      <button type="button" class="btn btn-gold dash-cta" id="book-recurring-btn">
        BOOK RECURRING LESSONS
        <svg class="arrow-svg" viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 H27 M18 2 L27 10 L18 18" /></svg>
      </button>
      <p class="form-status" id="book-status" role="status" aria-live="polite" hidden></p>
    </section>

    <!-- ---------------- tuition ---------------- -->
    <section class="dash-section card-teal">
      <h2 class="dash-section-heading">
        TUITION
        <svg class="hand-line" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 60 2, 140 10, 220 5 S 280 2, 298 7" /></svg>
      </h2>

      <p class="tuition-status" id="tuition-status">Loading…</p>

      <button type="button" class="btn btn-gold dash-cta" id="manage-subscription-btn">
        MANAGE SUBSCRIPTION
        <svg class="arrow-svg" viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 H27 M18 2 L27 10 L18 18" /></svg>
      </button>
      <p class="form-status" id="portal-status" role="status" aria-live="polite" hidden></p>
    </section>

    <!-- ---------------- message your coach ---------------- -->
    <section class="dash-section card-cream">
      <h2 class="dash-section-heading">
        MESSAGE YOUR COACH
        <svg class="hand-line" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 60 2, 140 10, 220 5 S 280 2, 298 7" /></svg>
      </h2>

      <div class="message-thread" id="message-thread">
        <p class="empty-state">Loading…</p>
      </div>

      <form class="message-form" id="message-form">
        <input
          type="text"
          id="message-input"
          name="message"
          placeholder="Type a message…"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn-gold message-send">SEND</button>
      </form>
    </section>
  </div>
</main>

<footer class="site-footer">
  <p class="footer-copyright">© 2026 KIH SKATEBOARDING</p>
</footer>

<script type="module" src="dashboard.js"></script>
</body>
</html>
