<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign In — KIH Skateboarding</title>
<meta name="description" content="Sign in to your KIH Skateboarding student or instructor account." />
<meta name="robots" content="noindex" />
<link rel="icon" href="kih-logo.png" type="image/png" />
<link rel="apple-touch-icon" href="kih-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo" aria-label="KIH Skateboarding home">
      <img src="kih-logo.png" alt="KIH Skateboarding logo" width="90" height="90" />
    </a>
  </div>
</header>

<main class="auth-main">
  <svg class="gold-splatter auth-splatter" viewBox="0 0 600 600" aria-hidden="true">
    <defs>
      <filter id="splatFilterAuth" x="-50%" y="-50%" width="200%" height="200%">
        <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="33" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="70" />
      </filter>
    </defs>
    <g fill="#E5B12E" filter="url(#splatFilterAuth)">
      <circle cx="300" cy="300" r="240" />
      <circle cx="70" cy="470" r="22" />
      <circle cx="530" cy="110" r="18" />
    </g>
  </svg>

  <div class="auth-wrap">
    <h1 class="section-heading auth-heading">
      SIGN IN
      <svg class="scribble-underline small" viewBox="0 0 320 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 14 C 50 5, 90 20, 140 11 S 220 3, 280 13 S 310 17, 316 9" />
      </svg>
    </h1>

    <div class="auth-card">
      <svg class="torn-edge" viewBox="0 0 600 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 24 L0 10 L20 18 L40 4 L62 16 L86 2 L110 14 L136 6 L160 18 L184 4 L208 16 L232 2 L256 14 L280 6 L304 18 L328 4 L352 16 L376 2 L400 14 L424 6 L448 18 L472 4 L496 16 L520 2 L544 14 L568 6 L592 18 L600 12 L600 24 Z" />
      </svg>

      <!-- Role selector: always visible, only matters for sign-up (it's
           saved into the new account's metadata). Ignored on sign-in
           since a returning user's role is already on their account. -->
      <fieldset class="role-toggle" id="role-toggle">
        <legend>I AM A...</legend>
        <label class="role-option">
          <input type="radio" name="role" value="student" checked />
          <span>STUDENT</span>
        </label>
        <label class="role-option">
          <input type="radio" name="role" value="instructor" />
          <span>INSTRUCTOR</span>
        </label>
      </fieldset>

      <div class="tab-toggle" role="tablist" aria-label="Sign in or sign up">
        <button type="button" class="tab-btn active" id="tab-signin" role="tab" aria-selected="true" aria-controls="form-signin">SIGN IN</button>
        <button type="button" class="tab-btn" id="tab-signup" role="tab" aria-selected="false" aria-controls="form-signup">SIGN UP</button>
      </div>

      <!-- ---------------- SIGN IN ---------------- -->
      <form class="auth-form" id="form-signin" novalidate>
        <div class="form-row">
          <label for="signin-email">EMAIL</label>
          <input type="email" id="signin-email" name="email" required autocomplete="email" inputmode="email" />
        </div>
        <div class="form-row">
          <label for="signin-password">PASSWORD</label>
          <input type="password" id="signin-password" name="password" required autocomplete="current-password" />
        </div>

        <button type="submit" class="btn btn-gold auth-submit">
          SIGN IN
          <svg class="arrow-svg" viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 H27 M18 2 L27 10 L18 18" /></svg>
        </button>

        <button type="button" class="auth-link" id="link-forgot">Forgot password?</button>
        <p class="form-status" role="status" aria-live="polite" hidden></p>
      </form>

      <!-- ---------------- SIGN UP ---------------- -->
      <form class="auth-form" id="form-signup" hidden novalidate>
        <div class="form-row">
          <label for="signup-name">FULL NAME</label>
          <input type="text" id="signup-name" name="name" required autocomplete="name" />
        </div>
        <div class="form-row">
          <label for="signup-email">EMAIL</label>
          <input type="email" id="signup-email" name="email" required autocomplete="email" inputmode="email" />
        </div>
        <div class="form-row">
          <label for="signup-password">PASSWORD</label>
          <input type="password" id="signup-password" name="password" required autocomplete="new-password" minlength="6" />
        </div>

        <button type="submit" class="btn btn-gold auth-submit">
          SIGN UP
          <svg class="arrow-svg" viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 H27 M18 2 L27 10 L18 18" /></svg>
        </button>

        <p class="form-status" role="status" aria-live="polite" hidden></p>
      </form>

      <!-- ---------------- FORGOT PASSWORD ---------------- -->
      <form class="auth-form" id="form-forgot" hidden novalidate>
        <p class="auth-copy">Enter your email and we'll send you a reset link.</p>
        <div class="form-row">
          <label for="forgot-email">EMAIL</label>
          <input type="email" id="forgot-email" name="email" required autocomplete="email" inputmode="email" />
        </div>

        <button type="submit" class="btn btn-gold auth-submit">
          SEND RESET LINK
          <svg class="arrow-svg" viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 H27 M18 2 L27 10 L18 18" /></svg>
        </button>

        <button type="button" class="auth-link" id="link-back-to-signin">Back to sign in</button>
        <p class="form-status" role="status" aria-live="polite" hidden></p>
      </form>

      <!-- ---------------- SET NEW PASSWORD (from email link) ---------------- -->
      <form class="auth-form" id="form-reset" hidden novalidate>
        <p class="auth-copy">Choose a new password for your account.</p>
        <div class="form-row">
          <label for="reset-password">NEW PASSWORD</label>
          <input type="password" id="reset-password" name="password" required autocomplete="new-password" minlength="6" />
        </div>
        <div class="form-row">
          <label for="reset-password-confirm">CONFIRM PASSWORD</label>
          <input type="password" id="reset-password-confirm" name="password_confirm" required autocomplete="new-password" minlength="6" />
        </div>

        <button type="submit" class="btn btn-gold auth-submit">
          SET NEW PASSWORD
          <svg class="arrow-svg" viewBox="0 0 30 20" aria-hidden="true"><path d="M1 10 H27 M18 2 L27 10 L18 18" /></svg>
        </button>

        <p class="form-status" role="status" aria-live="polite" hidden></p>
      </form>
    </div>
  </div>
</main>

<footer class="site-footer">
  <p class="footer-copyright">© 2026 KIH SKATEBOARDING</p>
</footer>

<script type="module" src="signin.js"></script>
</body>
</html>
