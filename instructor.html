<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instructor Dashboard — KIH Skateboarding</title>
<meta name="robots" content="noindex" />
<link rel="icon" href="kih-logo.png" type="image/png" />
<link rel="apple-touch-icon" href="kih-logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-logo" aria-label="KIH Skateboarding home">
      <img src="kih-logo.png" alt="KIH Skateboarding logo" width="90" height="90" />
    </a>
    <div class="dash-nav-user">
      <span class="dash-nav-name" id="user-name" hidden></span>
      <button type="button" class="btn dash-signout" id="signout-btn">SIGN OUT</button>
    </div>
  </div>
</header>

<main class="dash-main" id="dash-main" hidden>
  <div class="dash-wrap">
    <h1 class="section-heading dash-heading">
      COACH DASHBOARD
      <svg class="scribble-underline small" viewBox="0 0 320 24" preserveAspectRatio="none" aria-hidden="true">
        <path d="M4 14 C 50 5, 90 20, 140 11 S 220 3, 280 13 S 310 17, 316 9" />
      </svg>
    </h1>

    <!-- ---------------- today's schedule ---------------- -->
    <section class="dash-section card-cream">
      <h2 class="dash-section-heading">
        TODAY'S SCHEDULE
        <svg class="hand-line" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 60 2, 140 10, 220 5 S 280 2, 298 7" /></svg>
      </h2>
      <ul class="lesson-list" id="today-list">
        <li class="empty-state">Loading…</li>
      </ul>
    </section>

    <!-- ---------------- all students ---------------- -->
    <section class="dash-section card-teal">
      <h2 class="dash-section-heading">
        ALL STUDENTS
        <svg class="hand-line" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 60 2, 140 10, 220 5 S 280 2, 298 7" /></svg>
      </h2>
      <ul class="student-list" id="student-list">
        <li class="empty-state">Loading…</li>
      </ul>
    </section>

    <!-- ---------------- messages ---------------- -->
    <section class="dash-section card-cream">
      <h2 class="dash-section-heading">
        MESSAGES
        <svg class="hand-line" viewBox="0 0 300 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 6 C 60 2, 140 10, 220 5 S 280 2, 298 7" /></svg>
      </h2>

      <div class="messages-layout">
        <ul class="thread-list" id="thread-list">
          <li class="empty-state">Loading…</li>
        </ul>

        <div class="thread-panel" id="thread-panel">
          <p class="empty-state">Pick a student to view your conversation.</p>
        </div>
      </div>
    </section>
  </div>
</main>

<footer class="site-footer">
  <p class="footer-copyright">© 2026 KIH SKATEBOARDING</p>
</footer>

<script type="module" src="instructor.js"></script>
</body>
</html>
